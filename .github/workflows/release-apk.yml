name: Build and Release Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v3.0.0)'
        required: false
        default: 'v3.0.0'
      release_name:
        description: 'Release Title'
        required: false
        default: 'Namaz Tracker v3.0.0 (Build 17) - Official Release'
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Verify Permanent Release Keystore
        run: |
          if [ ! -f keystore/namaz-release.jks ]; then
            echo "ERROR: Permanent release keystore not found in keystore/namaz-release.jks!"
            exit 1
          fi
          echo "Verified permanent release keystore: keystore/namaz-release.jks"

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore/namaz-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'namaztracker123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'namaztracker123' }}

      - name: Locate and Package APK
        id: package_apk
        run: |
          RELEASE_DIR="app/build/outputs/apk/release"
          APK_FILE=$(find $RELEASE_DIR -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Release APK not found in $RELEASE_DIR"
            exit 1
          fi
          
          if [ -f version.properties ]; then
            V_MAJ=$(grep 'VERSION_MAJOR=' version.properties | cut -d'=' -f2 | tr -d '\r\n ')
            V_MIN=$(grep 'VERSION_MINOR=' version.properties | cut -d'=' -f2 | tr -d '\r\n ')
            V_PAT=$(grep 'VERSION_PATCH=' version.properties | cut -d'=' -f2 | tr -d '\r\n ')
            GRADLE_VER="${V_MAJ}.${V_MIN}.${V_PAT}"
          else
            GRADLE_VER=$(grep 'versionName = ' app/build.gradle.kts | head -1 | awk -F'"' '{print $2}')
          fi
          VERSION="v${GRADLE_VER:-3.0.0}"
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            VERSION="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          
          FINAL_NAME="Namaz-Tracker-${VERSION}.apk"
          cp "$APK_FILE" "$FINAL_NAME"
          echo "apk_path=$FINAL_NAME" >> $GITHUB_OUTPUT
          echo "tag_name=$VERSION" >> $GITHUB_OUTPUT
          echo "Release APK packaged: $FINAL_NAME"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Namaz-Tracker-Release-APK
          path: ${{ steps.package_apk.outputs.apk_path }}
          retention-days: 30

      - name: Generate Dynamic Release Notes from Git
        id: generate_notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "Previous tag detected: $PREV_TAG"
          
          TAG_NAME="${{ steps.package_apk.outputs.tag_name }}"
          
          cat << EOF > release_body.md
          ## 🕌 Namaz Tracker Android Release (${TAG_NAME})

          Welcome to the official release of **Namaz Tracker** — a modern, privacy-first Android application designed with an iOS frosted glass aesthetic and Nothing OS minimalist home screen widgets.

          ### 📦 Download & Installation
          1. Download the **\`Namaz-Tracker-${TAG_NAME}.apk\`** asset attached below.
          2. Open the downloaded \`.apk\` file on your Android device (Android 7.0+ supported).
          3. Grant notification & exact alarm permissions to enable accurate Adhan reminders and prayer countdowns.

          ---

          ### 🌟 Highlights & What's New in this Build:
          EOF

          # Extract commit description (body) of the latest commit if available
          LATEST_BODY=$(git log -1 --pretty=format:"%b")
          if [ -n "$LATEST_BODY" ]; then
            echo "$LATEST_BODY" >> release_body.md
            echo "" >> release_body.md
          fi

          # List commits since the previous release tag or recent commits
          echo "#### 📝 Commit History:" >> release_body.md
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" --no-merges >> release_body.md
          else
            git log -10 --pretty=format:"* %s (%h)" --no-merges >> release_body.md
          fi
          echo "" >> release_body.md

          cat << 'EOF' >> release_body.md

          ---
          *Built with Android Jetpack Compose, Material 3, and Kotlin.*
          EOF

      - name: Create GitHub Release and Upload APK
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package_apk.outputs.tag_name }}
          name: ${{ github.event.inputs.release_name || format('Namaz Tracker {0} - Official Release', steps.package_apk.outputs.tag_name) }}
          files: ${{ steps.package_apk.outputs.apk_path }}
          body_path: release_body.md
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
